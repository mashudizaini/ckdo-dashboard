version: "3.9"

services:

  # ── Backend: FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo-ap-invoice-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ORACLE_INSTANT_CLIENT=/opt/oracle/instantclient_23_4
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Mount Oracle Instant Client dari host (sama persis dgn dashboard-v2)
      - /opt/oracle/instantclient_23_4:/opt/oracle/instantclient_23_4:ro
      # Persist uploaded PDFs
      - ap_uploads:/app/uploads
    networks:
      - ckdo-net

  # ── Frontend: React (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ckdo-ap-invoice-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ckdo-net

volumes:
  ap_uploads:

networks:
  ckdo-net:
    # Kalau dashboard-v2 pakai network yang sama, ganti dengan:
    # external: true
    # name: nama_network_dashboard
    driver: bridge
