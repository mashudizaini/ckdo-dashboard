<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Magazine — Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  :root{
    --ink:#0F2422;
    --panel:#173330;
    --panel-2:#1D3F3B;
    --paper:#F6F1E7;
    --copper:#C4763B;
    --copper-soft:#D8935B;
    --mist:#DCE7E2;
    --mist-dim:#93A8A1;
    --line:rgba(220,231,226,.14);
    --shadow:0 30px 60px -20px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 45% -10%, #1A3B37 0%, transparent 60%),
      var(--ink);
    color:var(--mist);
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ── Top bar ────────────────────────────── */
  header{
    display:flex;align-items:center;gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(23,51,48,.85), rgba(23,51,48,.55));
    backdrop-filter:blur(6px);
    flex-shrink:0;
  }
  .masthead{display:flex;flex-direction:column;gap:2px;min-width:0}
  .masthead .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--copper-soft);
  }
  .masthead h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .spacer{flex:1}

  /* ── Content search ─────────────────────── */
  .search-wrap{position:relative;flex:0 1 300px;min-width:120px}
  .search-input{
    width:100%;
    font-family:'Inter',sans-serif;font-size:13px;
    color:var(--mist);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;
    padding:8px 12px 8px 32px;
    transition:border-color .15s;
  }
  .search-input::placeholder{color:var(--mist-dim)}
  .search-input:focus{outline:none;border-color:var(--copper)}
  .search-wrap::before{
    content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);
    font-size:12px;opacity:.6;pointer-events:none;
  }
  .search-results{
    position:absolute;top:calc(100% + 6px);right:0;
    width:min(380px,90vw);
    max-height:min(60vh,420px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);z-index:80;
    padding:6px;scrollbar-width:thin;
  }
  .search-results.hidden{display:none}
  .search-hint{padding:10px 12px;font-size:12px;color:var(--mist-dim)}
  .search-group{padding:6px 8px 2px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper-soft)}
  .search-result{
    display:block;width:100%;text-align:left;
    padding:8px 10px;border-radius:8px;border:none;background:transparent;
    color:var(--mist);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .search-result:hover,.search-result:focus-visible{background:var(--panel-2);outline:none}
  .search-result .pg{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--copper-soft);margin-bottom:2px}
  .search-result .snip{font-size:12.5px;line-height:1.5;color:var(--mist-dim)}
  .search-result .snip mark{background:rgba(196,118,59,.35);color:var(--mist);border-radius:2px;padding:0 1px}

  .btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
    color:var(--mist);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;cursor:pointer;transition:border-color .15s;
  }
  .btn:hover{border-color:var(--copper)}
  .btn:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .btn.icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  #editionsToggle{display:none}

  /* ── Content row: stage + sidebar ───────── */
  .content{flex:1;display:flex;min-height:0}

  main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:auto;padding:28px;min-width:0}
  #stage{position:relative;transition:transform .25s ease;transform-origin:center}

  .book{position:relative;display:flex;filter:drop-shadow(var(--shadow));perspective:2600px}
  /* Confirms a search-result jump landed even when the target page was
     already the one on screen (e.g. it's in the spread shown by default). */
  @keyframes searchJumpFlash{
    0%{box-shadow:0 0 0 0 rgba(196,118,59,.85)}
    100%{box-shadow:0 0 0 22px rgba(196,118,59,0)}
  }
  .book.search-jump::before{
    content:"";position:absolute;inset:-4px;border-radius:10px;
    animation:searchJumpFlash .9s ease-out;pointer-events:none;z-index:30;
  }
  .half{position:relative;background:var(--paper);overflow:hidden;width:var(--pw);height:var(--ph)}
  .half.left{border-radius:6px 0 0 6px}
  .half.right{border-radius:0 6px 6px 0}
  .half.empty{background:transparent}
  .half img{display:block;width:100%;height:100%;object-fit:contain;background:var(--paper)}
  .book::after{
    content:"";position:absolute;top:0;bottom:0;left:50%;width:70px;transform:translateX(-50%);
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.16) 46%, rgba(0,0,0,.26) 50%, rgba(0,0,0,.16) 54%, transparent);
    pointer-events:none;z-index:5;
  }
  .book.single::after{display:none}

  .sheet{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:8}
  .sheet .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden}
  .sheet .face img{display:block;width:100%;height:100%;object-fit:contain;background:var(--paper)}
  .sheet .face.back{transform:rotateY(180deg)}
  .sheet.fwd{left:50%;transform-origin:left center}
  .sheet.bwd{left:0;transform-origin:right center}
  .sheet.fwd .face.front{border-radius:0 6px 6px 0}
  .sheet.bwd .face.front{border-radius:6px 0 0 6px}
  @keyframes flipFwd{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
  @keyframes flipBwd{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
  .sheet.fwd.go{animation:flipFwd .65s cubic-bezier(.4,.1,.3,1) forwards}
  .sheet.bwd.go{animation:flipBwd .65s cubic-bezier(.4,.1,.3,1) forwards}
  @media (prefers-reduced-motion: reduce){.sheet.fwd.go,.sheet.bwd.go{animation-duration:.01s}}

  .ribbon{position:absolute;left:0;bottom:-14px;height:5px;width:100%;background:rgba(220,231,226,.12);border-radius:3px;overflow:hidden}
  .ribbon i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--copper-soft));transition:width .4s ease}

  .navBtn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line);color:var(--mist);
    font-size:18px;cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, opacity .2s;
  }
  .navBtn:hover{border-color:var(--copper)}
  .navBtn:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .navBtn[disabled]{opacity:.25;cursor:default}
  #prevBtn{left:18px} #nextBtn{right:18px}

  /* ── Editions sidebar (right) ───────────── */
  aside{
    width:280px;flex-shrink:0;
    border-left:1px solid var(--line);
    background:rgba(23,51,48,.5);
    display:flex;flex-direction:column;
    min-height:0;
  }
  aside .head{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  aside .head .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--copper-soft);
  }
  aside .head h2{font-family:'Fraunces',serif;font-size:17px;font-weight:700;margin-top:2px}
  #editionList{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
  .edition{
    display:flex;gap:12px;align-items:center;
    padding:10px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;background:transparent;
    text-align:left;color:var(--mist);font-family:'Inter',sans-serif;
    transition:background .15s, border-color .15s;width:100%;
  }
  .edition:hover{background:var(--panel-2)}
  .edition:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .edition.active{background:var(--panel-2);border-color:var(--copper)}
  .edition .spine{
    width:42px;height:56px;border-radius:4px;flex-shrink:0;overflow:hidden;
    background:linear-gradient(160deg,var(--panel-2),var(--ink));
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--copper-soft);
    letter-spacing:.05em;text-align:center;line-height:1.3;
  }
  .edition .spine img{width:100%;height:100%;object-fit:cover}
  .edition .meta{min-width:0}
  .edition .meta .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edition .meta .d{font-size:11.5px;color:var(--mist-dim);margin-top:2px}
  .edition.active .meta .d{color:var(--copper-soft)}
  #editionEmpty{padding:18px;font-size:13px;color:var(--mist-dim);line-height:1.6}

  /* ── Bottom bar ─────────────────────────── */
  footer{
    flex-shrink:0;display:flex;align-items:center;gap:14px;
    padding:10px 22px;border-top:1px solid var(--line);
    background:rgba(23,51,48,.6);
  }
  #pageInfo{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mist-dim);letter-spacing:.08em;white-space:nowrap}
  #thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;flex:1;scrollbar-width:thin}
  #thumbs canvas{
    height:56px;border-radius:3px;cursor:pointer;flex-shrink:0;
    border:2px solid transparent;transition:border-color .15s;background:var(--paper);
  }
  #thumbs canvas.active{border-color:var(--copper)}

  /* ── Overlay ────────────────────────────── */
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;text-align:center;
    background:var(--ink);z-index:50;padding:32px;
  }
  #overlay.hidden{display:none}
  #overlay .big{font-family:'Fraunces',serif;font-size:26px;font-weight:700}
  #overlay p{color:var(--mist-dim);font-size:14px;max-width:460px;line-height:1.6}
  #overlay .btn{padding:10px 20px}
  #bar{width:220px;height:4px;border-radius:2px;background:rgba(220,231,226,.12);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--copper);transition:width .2s}

  /* ── Responsive: sidebar becomes drawer ─── */
  @media (max-width:960px){
    #editionsToggle{display:inline-flex}
    aside{
      position:fixed;top:0;right:0;bottom:0;z-index:60;
      transform:translateX(100%);transition:transform .25s ease;
      background:var(--panel);box-shadow:-20px 0 50px rgba(0,0,0,.4);
    }
    aside.open{transform:translateX(0)}
    #drawerScrim{
      position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;
      opacity:0;pointer-events:none;transition:opacity .25s;
    }
    #drawerScrim.show{opacity:1;pointer-events:auto}
  }
  @media (max-width:720px){
    header{padding:10px 14px;gap:10px}
    .masthead h1{font-size:16px}
    main{padding:16px}
    #prevBtn{left:6px} #nextBtn{right:6px}
    footer{padding:8px 12px}
  }

  /* ── QR link buttons in header ─────────── */
  .qr-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    color:var(--copper-soft);background:var(--panel-2);
    border:1px solid var(--copper);border-radius:8px;
    padding:6px 12px;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s;white-space:nowrap;
  }
  .qr-btn:hover{background:rgba(196,118,59,.18);border-color:var(--copper-soft)}

  /* ── QR overlay link ───────────────────── */
  .qr-link{
    position:absolute;
    border:2px solid rgba(196,118,59,.75);
    border-radius:5px;
    background:rgba(196,118,59,.12);
    cursor:pointer;
    z-index:15;
    transition:background .18s, border-color .18s, box-shadow .18s;
    -webkit-tap-highlight-color:rgba(196,118,59,.35);
    box-shadow:0 0 0 3px rgba(196,118,59,.15);
  }
  .qr-link:hover,.qr-link:active{
    background:rgba(196,118,59,.28);
    border-color:var(--copper);
    box-shadow:0 0 0 4px rgba(196,118,59,.3);
  }
  .qr-link::after{
    content:attr(data-tip);
    position:absolute;
    bottom:calc(100% + 6px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(15,36,34,.92);
    color:var(--mist);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:4px 8px;
    border-radius:4px;
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s;
  }
  .qr-link:hover::after{opacity:1}
  @media (hover:none){
    /* on touch devices show label briefly on tap */
    .qr-link:active::after{opacity:1}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span class="eyebrow">Internal Magazine</span>
    <h1 id="magTitle">Reading Room</h1>
  </div>
  <div class="spacer"></div>
  <div id="qrLinksBar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
  <div class="search-wrap">
    <input type="search" id="searchInput" class="search-input" placeholder="Search inside magazines…" autocomplete="off">
    <div id="searchResults" class="search-results hidden"></div>
  </div>
  <button class="btn icon" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
  <button class="btn icon" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
  <button class="btn icon" id="fsBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  <button class="btn" id="editionsToggle">Editions</button>
</header>

<div class="content">
  <main id="viewer">
    <button class="navBtn" id="prevBtn" aria-label="Previous page">‹</button>
    <div id="stage">
      <div class="book" id="book">
        <div class="half left empty" id="halfL"></div>
        <div class="half right" id="halfR"></div>
        <div class="ribbon"><i id="ribbonFill"></i></div>
      </div>
    </div>
    <button class="navBtn" id="nextBtn" aria-label="Next page">›</button>

    <div id="overlay">
      <div class="big">Internal Magazine Reading Room</div>
      <p id="overlayMsg">Loading edition…</p>
      <div id="bar" hidden><i id="barFill"></i></div>
    </div>
  </main>

  <aside id="editionsPanel" aria-label="Edition list">
    <div class="head">
      <span class="eyebrow">Library</span>
      <h2>Editions</h2>
    </div>
    <div id="editionList" role="list"></div>
  </aside>
</div>
<div id="drawerScrim"></div>

<footer>
  <span id="pageInfo">— / —</span>
  <div id="thumbs" aria-label="Page navigation"></div>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — the only section you need to edit.
   Put your PDF files inside the "magazines/" folder next to this
   index.html, then register each edition below.
   The first edition in the list loads automatically.
   "cover" is optional (path to a cover image); if omitted, a
   generated spine label is shown instead.
═══════════════════════════════════════════════════════════════ */
/* Editions are loaded dynamically from magazines/index.json (managed via HR Dashboard) */
const CONFIG = { companyName: "CKDO Magazine", editions: [] };
/* ═══════════════════════════════════════════════════════════════ */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const els = {
  title:$("magTitle"), book:$("book"),
  halfL:$("halfL"), halfR:$("halfR"), prev:$("prevBtn"), next:$("nextBtn"),
  info:$("pageInfo"), thumbs:$("thumbs"), overlay:$("overlay"),
  overlayMsg:$("overlayMsg"), bar:$("bar"), barFill:$("barFill"), ribbon:$("ribbonFill"),
  stage:$("stage"), viewer:$("viewer"),
  editionList:$("editionList"), panel:$("editionsPanel"),
  scrim:$("drawerScrim"), toggle:$("editionsToggle"),
  searchInput:$("searchInput"), searchResults:$("searchResults")
};

let pdf = null, numPages = 0, aspect = 0.707;
let spread = 0, singleMode = false, singlePage = 1;
let zoom = 1, flipping = false, activeEdition = -1;
const imgCache = new Map();
const qrCache  = new Map(); // pageNum -> [{x,y,w,h,url}] in canvas-space
const dimCache = new Map(); // pageNum -> {cw, ch}

/* ── QR detection ───────────────────────── */
function _jsqrOnCanvas(c){
  if(typeof jsQR === "undefined") return null;
  const ctx = c.getContext("2d");
  const img = ctx.getImageData(0, 0, c.width, c.height);
  return jsQR(img.data, img.width, img.height, {inversionAttempts:"attemptBoth"});
}
function _jsqrResultToQr(code, scaleX, scaleY){
  const p = code.location;
  const xs = [p.topLeftCorner.x,p.topRightCorner.x,p.bottomRightCorner.x,p.bottomLeftCorner.x];
  const ys = [p.topLeftCorner.y,p.topRightCorner.y,p.bottomRightCorner.y,p.bottomLeftCorner.y];
  const x = Math.min(...xs)*scaleX, y = Math.min(...ys)*scaleY;
  const w = (Math.max(...xs)-Math.min(...xs))*scaleX;
  const h = (Math.max(...ys)-Math.min(...ys))*scaleY;
  return {x, y, w, h, url: code.data};
}

async function detectQRs(srcCanvas){
  const results = [];

  // 1. BarcodeDetector — try on ImageBitmap (more reliable than raw canvas)
  if(typeof BarcodeDetector !== "undefined"){
    try{
      const supported = await BarcodeDetector.getSupportedFormats();
      if(supported.includes("qr_code")){
        const bm = await createImageBitmap(srcCanvas);
        const bd = new BarcodeDetector({formats:["qr_code"]});
        const codes = await bd.detect(bm);
        bm.close();
        for(const code of codes){
          if(!code.rawValue) continue;
          const {x,y,width,height} = code.boundingBox;
          results.push({x, y, w:width, h:height, url:code.rawValue});
        }
        if(results.length){
          console.log("[QR] BarcodeDetector found:", results.map(r=>r.url));
          return results;
        }
      }
    }catch(e){ console.warn("[QR] BarcodeDetector error:", e); }
  }

  // 2. jsQR on the full-resolution canvas
  {
    const code = _jsqrOnCanvas(srcCanvas);
    if(code && code.data){
      console.log("[QR] jsQR full-res found:", code.data);
      results.push(_jsqrResultToQr(code, 1, 1));
      return results;
    }
  }

  // 3. jsQR on a downscaled canvas (better for large pages)
  if(typeof jsQR !== "undefined"){
    const TARGET = 800;
    const scale  = Math.min(TARGET / srcCanvas.width, TARGET / srcCanvas.height, 1);
    if(scale < 0.99){
      const sc = document.createElement("canvas");
      sc.width  = Math.round(srcCanvas.width  * scale);
      sc.height = Math.round(srcCanvas.height * scale);
      sc.getContext("2d").drawImage(srcCanvas, 0, 0, sc.width, sc.height);
      const code = _jsqrOnCanvas(sc);
      if(code && code.data){
        console.log("[QR] jsQR downscaled found:", code.data);
        results.push(_jsqrResultToQr(code, 1/scale, 1/scale));
        return results;
      }
    }
  }

  return results;
}

function addQROverlays(halfEl, pageNum){
  const qrs = qrCache.get(pageNum);
  const dim = dimCache.get(pageNum);
  if(!qrs || !qrs.length || !dim) return;
  const pw = parseFloat(getComputedStyle(els.book).getPropertyValue("--pw")) || halfEl.clientWidth;
  const ph = parseFloat(getComputedStyle(els.book).getPropertyValue("--ph")) || halfEl.clientHeight;
  const sx = pw / dim.cw, sy = ph / dim.ch;
  for(const qr of qrs){
    const isUrl = /^https?:\/\//i.test(qr.url);
    const a = document.createElement("a");
    a.className = "qr-link";
    if(isUrl){
      a.href = qr.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    } else {
      a.href = "#";
      a.addEventListener("click", e => {
        e.preventDefault();
        if(qr.url.startsWith("http") || qr.url.startsWith("www")){
          window.open("https://"+qr.url.replace(/^https?:\/\//,""), "_blank");
        } else {
          alert("QR Code:\n" + qr.url);
        }
      });
    }
    const tip = qr.url.length > 50 ? qr.url.slice(0,50)+"…" : qr.url;
    a.setAttribute("data-tip", tip);
    a.title = qr.url;
    a.style.cssText = `left:${Math.round(qr.x*sx)}px;top:${Math.round(qr.y*sy)}px;width:${Math.round(qr.w*sx)}px;height:${Math.round(qr.h*sy)}px`;
    halfEl.appendChild(a);
    console.log(`[QR] Overlay page ${pageNum}: ${qr.url} at (${Math.round(qr.x*sx)},${Math.round(qr.y*sy)}) ${Math.round(qr.w*sx)}×${Math.round(qr.h*sy)}px`);
  }
}

els.title.textContent = CONFIG.companyName;

/* ── Editions sidebar ───────────────────── */
function buildEditionList(){
  els.editionList.innerHTML = "";
  if(!CONFIG.editions.length){
    const d = document.createElement("div");
    d.id = "editionEmpty";
    d.textContent = "No editions registered yet. Edit the CONFIG section in index.html to add them.";
    els.editionList.appendChild(d);
    return;
  }
  CONFIG.editions.forEach((e,i)=>{
    const b = document.createElement("button");
    b.className = "edition"; b.setAttribute("role","listitem");
    const spine = document.createElement("div"); spine.className = "spine";
    if(e.cover){ spine.innerHTML = `<img src="${e.cover}" alt="">`; }
    else { spine.textContent = (e.date||e.title||"ED").split(" ").map(w=>w.slice(0,4)).slice(0,2).join("\n"); }
    const meta = document.createElement("div"); meta.className = "meta";
    meta.innerHTML = `<div class="t"></div><div class="d"></div>`;
    meta.querySelector(".t").textContent = e.title;
    meta.querySelector(".d").textContent = e.date || "";
    b.append(spine, meta);
    b.addEventListener("click", ()=>{
      selectEdition(i);
      closeDrawer();
    });
    els.editionList.appendChild(b);
  });
}
function markActiveEdition(){
  [...els.editionList.querySelectorAll(".edition")].forEach((b,i)=>
    b.classList.toggle("active", i===activeEdition));
}
function updateQRLinksBar(edition){
  const bar = document.getElementById("qrLinksBar");
  if(!bar) return;
  bar.innerHTML = "";
  const links = edition?.qr_links || [];
  links.forEach(ql => {
    const a = document.createElement("a");
    a.className = "qr-btn";
    a.href = ql.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `<span>📷</span> ${ql.label}`;
    bar.appendChild(a);
  });
}
function selectEdition(i){
  const e = CONFIG.editions[i];
  if(!e) return;
  activeEdition = i;
  markActiveEdition();
  updateQRLinksBar(e);
  return loadEdition(e.file, e.title);
}

/* drawer (mobile) */
function openDrawer(){ els.panel.classList.add("open"); els.scrim.classList.add("show"); }
function closeDrawer(){ els.panel.classList.remove("open"); els.scrim.classList.remove("show"); }
els.toggle.onclick = openDrawer;
els.scrim.onclick = closeDrawer;

/* ── Document loading ───────────────────── */
async function loadEdition(src, label){
  resetState();
  els.overlay.classList.remove("hidden");
  els.overlayMsg.textContent = "Loading " + (label||"document") + "…";
  els.bar.hidden = false;
  try{
    const task = pdfjsLib.getDocument(src);
    task.onProgress = p => {
      if(p.total) els.barFill.style.width = Math.round(p.loaded/p.total*100)+"%";
    };
    pdf = await task.promise;
    numPages = pdf.numPages;
    const vp = (await pdf.getPage(1)).getViewport({scale:1});
    aspect = vp.width / vp.height;
    els.overlay.classList.add("hidden");
    layout();
    await showSpread(0, true);
    buildThumbs();
  }catch(err){
    els.bar.hidden = true;
    els.overlayMsg.textContent = "Edisi gagal dimuat. Pastikan file PDF tersedia di server.";
    console.error("loadEdition error:", err);
  }
}
function resetState(){
  pdf=null; numPages=0; spread=0; singlePage=1; zoom=1;
  imgCache.clear(); qrCache.clear(); dimCache.clear();
  els.thumbs.innerHTML=""; applyZoom();
}

/* ── Page -> image rendering ────────────── */
async function pageImage(n){
  if(!n || n<1 || n>numPages) return null;
  if(imgCache.has(n)) return imgCache.get(n);
  const page = await pdf.getPage(n);
  const scale = 1400 / page.getViewport({scale:1}).height;
  const vp = page.getViewport({scale});
  const c = document.createElement("canvas");
  c.width = vp.width; c.height = vp.height;
  await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
  // Scan QR before JPEG conversion (lossless canvas is more reliable)
  dimCache.set(n, {cw:vp.width, ch:vp.height});
  const qrs = await detectQRs(c);
  if(qrs.length) qrCache.set(n, qrs);
  const url = c.toDataURL("image/jpeg", .88);
  imgCache.set(n, url);
  return url;
}

/* ── Layout & sizing ────────────────────── */
function layout(){
  singleMode = window.innerWidth < 720;
  const availW = els.viewer.clientWidth - 140;
  const availH = els.viewer.clientHeight - 70;
  let ph = availH;
  let pw = ph * aspect;
  const maxW = singleMode ? availW : availW/2;
  if(pw > maxW){ pw = maxW; ph = pw / aspect; }
  els.book.style.setProperty("--pw", pw+"px");
  els.book.style.setProperty("--ph", ph+"px");
  els.book.classList.toggle("single", singleMode);
  els.halfL.style.display = singleMode ? "none" : "";
}

/* ── Spread logic ───────────────────────── */
const maxSpread = () => Math.floor((numPages-1)/2);
function spreadPages(k){
  const l = 2*k+1;
  const r = l+1;
  return [l, r<=numPages ? r : null];
}
function setHalf(el, url, pageNum){
  el.innerHTML = "";
  el.classList.toggle("empty", !url);
  if(url){
    const im=document.createElement("img"); im.src=url; el.appendChild(im);
    if(pageNum) addQROverlays(el, pageNum);
  }
}
async function showSpread(k){
  if(singleMode){ return showSingle(1); }
  spread = Math.max(0, Math.min(k, maxSpread()));
  const [l,r] = spreadPages(spread);
  const [li,ri] = await Promise.all([pageImage(l), pageImage(r)]);
  setHalf(els.halfL, li, l); setHalf(els.halfR, ri, r);
  updateChrome();
  preloadAround();
}
async function showSingle(p){
  singlePage = Math.max(1, Math.min(p, numPages));
  const url = await pageImage(singlePage);
  setHalf(els.halfR, url, singlePage);
  updateChrome();
}

/* ── Flip animation ─────────────────────── */
async function flip(dir){
  if(flipping || !pdf) return;
  if(singleMode){
    const t = singlePage + dir;
    if(t<1 || t>numPages) return;
    singlePage = t;
    setHalf(els.halfR, await pageImage(t), t);
    updateChrome(); preloadAround();
    return;
  }
  const target = spread + dir;
  if(target<0 || target>maxSpread()) return;
  flipping = true;
  const [cl,cr] = spreadPages(spread);
  const [nl,nr] = spreadPages(target);
  const sheet = document.createElement("div");
  sheet.className = "sheet " + (dir>0?"fwd":"bwd");
  const front = document.createElement("div"); front.className="face front";
  const back  = document.createElement("div"); back.className="face back";
  sheet.append(front, back);

  if(dir>0){
    const [fi,bi,ui] = await Promise.all([pageImage(cr), pageImage(nl), pageImage(nr)]);
    if(fi){ front.innerHTML = `<img src="${fi}">`; }
    if(bi){ back.innerHTML  = `<img src="${bi}">`; }
    setHalf(els.halfR, ui, nr);
  }else{
    const [fi,bi,ui] = await Promise.all([pageImage(cl), pageImage(nr), pageImage(nl)]);
    if(fi){ front.innerHTML = `<img src="${fi}">`; }
    if(bi){ back.innerHTML  = `<img src="${bi}">`; }
    setHalf(els.halfL, ui, nl);
  }
  els.book.appendChild(sheet);
  requestAnimationFrame(()=>sheet.classList.add("go"));
  sheet.addEventListener("animationend", async ()=>{
    spread = target;
    const [l,r] = spreadPages(spread);
    if(dir>0) setHalf(els.halfL, await pageImage(l), l);
    else      setHalf(els.halfR, await pageImage(r), r);
    sheet.remove();
    flipping = false;
    updateChrome(); preloadAround();
  }, {once:true});
}
function preloadAround(){
  if(!pdf) return;
  if(singleMode){
    pageImage(singlePage+1); pageImage(singlePage-1);
  }else{
    [spread-1, spread+1].forEach(k=>{
      if(k>=0 && k<=maxSpread()) spreadPages(k).forEach(p=>p&&pageImage(p));
    });
  }
}

/* ── Info, ribbon, thumbnails ───────────── */
function currentLabel(){
  if(singleMode) return `PAGE ${singlePage} / ${numPages}`;
  const [l,r] = spreadPages(spread);
  if(l&&r) return `PAGES ${l}–${r} / ${numPages}`;
  return `PAGE ${l||r} / ${numPages}`;
}
function updateChrome(){
  els.info.textContent = currentLabel();
  const prog = singleMode ? singlePage/numPages
             : (spreadPages(spread)[1]||spreadPages(spread)[0])/numPages;
  els.ribbon.style.width = Math.round(prog*100)+"%";
  if(singleMode){
    els.prev.disabled = singlePage<=1;
    els.next.disabled = singlePage>=numPages;
  }else{
    els.prev.disabled = spread<=0;
    els.next.disabled = spread>=maxSpread();
  }
  [...els.thumbs.children].forEach(c=>{
    const p = +c.dataset.page;
    const active = singleMode ? p===singlePage : spreadPages(spread).includes(p);
    c.classList.toggle("active", active);
  });
}
async function buildThumbs(){
  els.thumbs.innerHTML = "";
  for(let n=1;n<=numPages;n++){
    const page = await pdf.getPage(n);
    const scale = 56 / page.getViewport({scale:1}).height * (window.devicePixelRatio||1);
    const vp = page.getViewport({scale});
    const c = document.createElement("canvas");
    c.width=vp.width; c.height=vp.height;
    c.style.height="56px";
    c.dataset.page = n;
    c.title = "Page "+n;
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    c.addEventListener("click", ()=>{
      if(singleMode) showSingle(n);
      else showSpread(Math.floor((n-1)/2));
    });
    els.thumbs.appendChild(c);
  }
  updateChrome();
}

/* ── Zoom & fullscreen ──────────────────── */
function applyZoom(){ els.stage.style.transform = `scale(${zoom})`; }
$("zoomIn").onclick  = ()=>{ zoom=Math.min(2.5, zoom+.2); applyZoom(); };
$("zoomOut").onclick = ()=>{ zoom=Math.max(.6, zoom-.2); applyZoom(); };
$("fsBtn").onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

/* ── Interaction ────────────────────────── */
els.prev.onclick = ()=>flip(-1);
els.next.onclick = ()=>flip(1);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") flip(1);
  if(e.key==="ArrowLeft")  flip(-1);
});
window.addEventListener("resize", ()=>{
  if(!pdf) return;
  const wasSingle = singleMode;
  layout();
  if(wasSingle!==singleMode){
    if(singleMode){ showSingle(spreadPages(spread)[1]||spreadPages(spread)[0]||1); }
    else { showSpread(Math.floor((singlePage-1)/2)); }
  }
});

/* ── Embed mode: hide chrome when ?embed=1 ── */
if(new URLSearchParams(location.search).get("embed") === "1"){
  document.querySelector("header").style.display = "none";
  document.querySelector("footer").style.display = "none";
  document.querySelector("aside").style.display  = "none";
}

/* ── Content search ─────────────────────── */
/* Searches per-page text extracted server-side via the HR Dashboard's
   "Convert to Text" button (backend writes magazines/{filename}.pages.json
   next to each PDF). An edition with no such file simply isn't searchable
   yet — handled as a soft miss, not an error. */
const pagesTextCache = new Map(); // editionIndex -> string[] | null
let searchSeq = 0; // guards against a slow/stale search overwriting a newer one

async function getEditionPages(i){
  if(pagesTextCache.has(i)) return pagesTextCache.get(i);
  const e = CONFIG.editions[i];
  let pages = null;
  try{
    const res = await fetch("magazines/" + encodeURIComponent(e.filename) + ".pages.json?_=" + Date.now());
    if(res.ok){
      const data = await res.json();
      pages = Array.isArray(data.pages) ? data.pages : null;
    }
  }catch(_){ /* not converted yet, or offline — treat as unsearchable */ }
  pagesTextCache.set(i, pages);
  return pages;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function snippetHtml(text, pos, qLen){
  const start = Math.max(0, pos-40);
  const end   = Math.min(text.length, pos+qLen+70);
  const before = escapeHtml(text.slice(start,pos));
  const match  = escapeHtml(text.slice(pos,pos+qLen));
  const after  = escapeHtml(text.slice(pos+qLen,end));
  return (start>0?"…":"") + before + "<mark>" + match + "</mark>" + after + (end<text.length?"…":"");
}

function renderSearchResults(results, query, anyUnsearchable){
  els.searchResults.innerHTML = "";
  els.searchResults.classList.remove("hidden");
  if(!query){ els.searchResults.classList.add("hidden"); return; }
  if(!results.length){
    const hint = document.createElement("div");
    hint.className = "search-hint";
    hint.textContent = anyUnsearchable
      ? "No matches. Some editions aren't searchable yet — convert them to text via HR Dashboard → e-Magazine."
      : `No matches for "${query}".`;
    els.searchResults.appendChild(hint);
    return;
  }
  let lastEdition = null;
  results.slice(0, 40).forEach(r => {
    if(r.editionTitle !== lastEdition){
      const g = document.createElement("div");
      g.className = "search-group";
      g.textContent = r.editionTitle;
      els.searchResults.appendChild(g);
      lastEdition = r.editionTitle;
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "search-result";
    b.innerHTML = `<div class="pg">PAGE ${r.page}</div><div class="snip">${r.html}</div>`;
    b.addEventListener("click", () => goToSearchResult(r));
    els.searchResults.appendChild(b);
  });
}

async function runSearch(query){
  const q = query.trim();
  const mySeq = ++searchSeq;
  if(q.length < 2){ renderSearchResults([], "", false); return; }
  const qLower = q.toLowerCase();
  const results = [];
  let anyUnsearchable = false;
  for(let i=0;i<CONFIG.editions.length;i++){
    const pages = await getEditionPages(i);
    if(mySeq !== searchSeq) return; // a newer keystroke superseded this search
    if(!pages){ anyUnsearchable = true; continue; }
    pages.forEach((text, idx) => {
      if(!text) return;
      const pos = text.toLowerCase().indexOf(qLower);
      if(pos === -1) return;
      results.push({
        editionIndex: i, editionTitle: CONFIG.editions[i].title, page: idx+1,
        html: snippetHtml(text, pos, q.length),
      });
    });
  }
  if(mySeq !== searchSeq) return;
  renderSearchResults(results, q, anyUnsearchable);
}

async function goToSearchResult(r){
  console.log("[search] jumping to", r.editionTitle, "page", r.page, "(current edition:", activeEdition, ", target:", r.editionIndex, ")");
  els.searchResults.classList.add("hidden");
  els.searchInput.blur();
  try{
    if(activeEdition !== r.editionIndex){
      await selectEdition(r.editionIndex);
    }
    if(singleMode) await showSingle(r.page);
    else await showSpread(Math.floor((r.page-1)/2));
    // Visible confirmation even when the target page was already the one
    // on screen (common for early pages — they land in the default spread).
    els.book.classList.remove("search-jump");
    void els.book.offsetWidth; // restart the animation if it's already running
    els.book.classList.add("search-jump");
    els.stage.scrollIntoView({block:"center", inline:"center"});
  }catch(err){
    console.error("[search] goToSearchResult failed:", err);
  }
}

let searchDebounce = null;
els.searchInput.addEventListener("input", e => {
  clearTimeout(searchDebounce);
  const q = e.target.value;
  searchDebounce = setTimeout(() => runSearch(q), 250);
});
els.searchInput.addEventListener("focus", () => {
  if(els.searchInput.value.trim().length >= 2) els.searchResults.classList.remove("hidden");
});
document.addEventListener("click", e => {
  if(!e.target.closest(".search-wrap")) els.searchResults.classList.add("hidden");
});
els.searchInput.addEventListener("keydown", e => {
  if(e.key === "Escape"){ els.searchInput.value=""; els.searchResults.classList.add("hidden"); els.searchInput.blur(); }
});

/* ── Start — load editions from server ───── */
(async function(){
  try{
    const res  = await fetch("magazines/index.json?_=" + Date.now());
    const list = res.ok ? await res.json() : [];
    CONFIG.editions = list.map(e => ({
      title:    e.title || e.filename,
      date:     e.date  || "",
      file:     "magazines/" + encodeURIComponent(e.filename),
      filename: e.filename,
    }));
  }catch(_){
    CONFIG.editions = [];
  }
  buildEditionList();
  if(CONFIG.editions.length){
    selectEdition(0);
  }else{
    els.overlayMsg.textContent = "Belum ada edisi tersedia. Silakan upload melalui HR Dashboard.";
  }
})();
</script>
