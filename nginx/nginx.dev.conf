worker_processes 1;

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Meeting Notes audio uploads can be a 1-2 hour recording — 50M was
  # rejecting those with a 413 (HTML body) before the request ever reached
  # the backend, which the frontend then failed to JSON.parse ("Unexpected
  # token '<'"). 1024M leaves real headroom over what a multi-hour webm/opus
  # recording actually needs.
  client_max_body_size 1024M;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }
  upstream keycloak { server keycloak:8080; }

  server {
    listen 80;
    server_name localhost;

    location /e-magazine/ {
      root /usr/share/nginx/html;
      index index.html;
    }
    # Frontend (React dev server)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Backend API
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Knowledge Base PDF ingest (OCR for scanned pages) can run well past
      # nginx's 60s default — OCR itself is unbounded (only the embedding
      # step after it has a 40s cap), so a large/scanned PDF was hitting
      # nginx's upstream read timeout (504, HTML body) before the backend
      # ever got to respond with JSON. Measured ~257s for a real 6MB/
      # multi-page scanned PDF, so 600s leaves real headroom rather than
      # cutting it close.
      # Meeting Notes transcription (backend's own TRANSCRIBE_TIMEOUT_SECONDS
      # is 1800s / 30min for the GPU Whisper call) was hitting this same
      # 600s ceiling before the backend could ever respond — a 504 with an
      # HTML body the frontend then failed to JSON.parse ("Unexpected token
      # '<'"), same failure mode as the OCR case below but for a longer op.
      # 2000s clears the backend's own 1800s cap with margin.
      proxy_connect_timeout 2000s;
      proxy_send_timeout    2000s;
      proxy_read_timeout    2000s;
    }

    # Keycloak
    location /auth/ {
      proxy_pass http://keycloak/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTPS — self-signed cert (dev only). Needed for browser microphone
  # access (Meeting Notes live recording): getUserMedia is blocked by all
  # modern browsers on insecure (plain HTTP) origins except localhost, so
  # http://dashboard-dev.ckd-otto.com could never record audio no matter
  # what the frontend code did. Browsers show a one-time "Not Secure"
  # warning for the self-signed cert (click Advanced > Proceed) — that
  # warning is about certificate trust, not about the secure-context flag
  # microphone access checks, so it doesn't block getUserMedia once
  # accepted. Same locations as the :80 server, just proxied over TLS.
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    location /e-magazine/ {
      root /usr/share/nginx/html;
      index index.html;
    }
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Meeting Notes transcription (backend's own TRANSCRIBE_TIMEOUT_SECONDS
      # is 1800s / 30min for the GPU Whisper call) was hitting this same
      # 600s ceiling before the backend could ever respond — a 504 with an
      # HTML body the frontend then failed to JSON.parse ("Unexpected token
      # '<'"), same failure mode as the OCR case below but for a longer op.
      # 2000s clears the backend's own 1800s cap with margin.
      proxy_connect_timeout 2000s;
      proxy_send_timeout    2000s;
      proxy_read_timeout    2000s;
    }
    location /auth/ {
      proxy_pass http://keycloak/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
