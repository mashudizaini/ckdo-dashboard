worker_processes 1;

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Meeting Notes audio uploads can run 2-5 hours — 50M was rejecting those
  # with a 413 (HTML body) before the request ever reached the backend,
  # which the frontend then failed to JSON.parse ("Unexpected token '<'").
  # 2048M leaves real headroom over what even a 5h webm/opus recording
  # actually needs (a few hundred MB at typical voice bitrates).
  client_max_body_size 2048M;

  # Keycloak's login response headers (Set-Cookie/session state) run past
  # nginx's default 4k/8k proxy buffers once an external identity provider
  # is in the redirect chain (kc_idp_hint=google) — nginx then can't
  # buffer the upstream's response headers at all and drops the whole
  # request with 502 "upstream sent too big header", an HTML error page
  # the frontend can't parse. A plain nginx restart doesn't fix this
  # since it's a fixed buffer-size limit, not transient state. Applied at
  # http{} scope so both the :80 and :443 /auth/ blocks below inherit it.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  large_client_header_buffers 4 32k;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }
  upstream keycloak { server keycloak:8080; }

  server {
    listen 80;
    server_name localhost;

    location /e-magazine/ {
      root /usr/share/nginx/html;
      index index.html;
    }
    # Frontend (React dev server)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Backend API
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Knowledge Base PDF ingest (OCR for scanned pages) can run well past
      # nginx's 60s default — OCR itself is unbounded (only the embedding
      # step after it has a 40s cap), so a large/scanned PDF was hitting
      # nginx's upstream read timeout (504, HTML body) before the backend
      # ever got to respond with JSON. Measured ~257s for a real 6MB/
      # multi-page scanned PDF, so 600s leaves real headroom rather than
      # cutting it close.
      # Meeting Notes transcription (backend's own TRANSCRIBE_TIMEOUT_SECONDS,
      # raised to 3600s/1h to comfortably cover a 5h meeting at Whisper's
      # ~17x realtime plus upload time) was hitting a lower ceiling here
      # before the backend could ever respond — a 504 with an HTML body the
      # frontend then failed to JSON.parse ("Unexpected token '<'"), same
      # failure mode as the OCR case below but for a longer op. 3900s clears
      # the backend's own 3600s cap with margin.
      proxy_connect_timeout 3900s;
      proxy_send_timeout    3900s;
      proxy_read_timeout    3900s;
    }

    # Keycloak
    location /auth/ {
      proxy_pass http://keycloak/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTPS — self-signed cert (dev only). Needed for browser microphone
  # access (Meeting Notes live recording): getUserMedia is blocked by all
  # modern browsers on insecure (plain HTTP) origins except localhost, so
  # http://dashboard-dev.ckd-otto.com could never record audio no matter
  # what the frontend code did. Browsers show a one-time "Not Secure"
  # warning for the self-signed cert (click Advanced > Proceed) — that
  # warning is about certificate trust, not about the secure-context flag
  # microphone access checks, so it doesn't block getUserMedia once
  # accepted. Same locations as the :80 server, just proxied over TLS.
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    location /e-magazine/ {
      root /usr/share/nginx/html;
      index index.html;
    }
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Meeting Notes transcription (backend's own TRANSCRIBE_TIMEOUT_SECONDS,
      # raised to 3600s/1h to comfortably cover a 5h meeting at Whisper's
      # ~17x realtime plus upload time) was hitting a lower ceiling here
      # before the backend could ever respond — a 504 with an HTML body the
      # frontend then failed to JSON.parse ("Unexpected token '<'"), same
      # failure mode as the OCR case below but for a longer op. 3900s clears
      # the backend's own 3600s cap with margin.
      proxy_connect_timeout 3900s;
      proxy_send_timeout    3900s;
      proxy_read_timeout    3900s;
    }
    location /auth/ {
      proxy_pass http://keycloak/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
