services:
  # ─────────────────────────────────────────
  # KEYCLOAK — Auth Server
  # ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ckdo_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo_backend
    env_file: .env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./oracle_client:/opt/oracle/instantclient
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - ckdo_net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # CELERY WORKER — Async Tasks
  # ─────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo_celery
    env_file: .env
    volumes:
      - ./backend:/app
      - ./oracle_client:/opt/oracle/instantclient
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - backend
    networks:
      - ckdo_net
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ─────────────────────────────────────────
  # FRONTEND — React + Vite (dev server)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ckdo_frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # NGINX — Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ckdo_nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - keycloak
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # POSTGRESQL — Database
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ckdo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ckdo_dashboard,keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # REDIS — Cache + Queue Broker
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ckdo_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdo_net
    restart: unless-stopped

# ─────────────────────────────────────────
networks:
  ckdo_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
