services:
  # ─────────────────────────────────────────
  # KEYCLOAK — Auth Server
  # ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ckdo_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-dashboard-dev.ckd-otto.com}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
      # nginx proxies both http (80) and https (443) to Keycloak's plain
      # http backend — without this, Keycloak can't tell which scheme the
      # browser actually used and defaults to treating everything as http,
      # generating http:// URLs even for requests that came in over https
      # (breaks the https login flow with mixed-content errors downstream).
      # xforwarded = trust nginx's X-Forwarded-Proto/-For/Host headers
      # (already set in nginx.dev.conf's /auth/ location).
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ckdo_net
    extra_hosts:
      - "oauth2.googleapis.com:142.250.4.95"
      - "accounts.google.com:74.125.200.84"
      - "openidconnect.googleapis.com:216.239.34.223"
      - "www.googleapis.com:74.125.68.95"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo_backend
    env_file: .env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./oracle_client:/opt/oracle/instantclient
      - uploads_data:/app/uploads
      - ./e-magazine/magazines:/app/magazine-uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - ckdo_net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # CELERY WORKER — Async Tasks
  # ─────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo_celery
    env_file: .env
    volumes:
      - ./backend:/app
      - ./oracle_client:/opt/oracle/instantclient
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - backend
    networks:
      - ckdo_net
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ─────────────────────────────────────────
  # CELERY BEAT — EIS ETL Scheduler
  # ─────────────────────────────────────────
  # Separate container from the worker (not `celery worker -B`) — matches
  # the standalone eis-dashboard-v2 app's own beat+worker split this
  # replaces, and keeps a beat restart/crash from taking the worker down
  # with it. Schedule: app/tasks/celery_app.py's beat_schedule.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckdo_celery_beat
    env_file: .env
    volumes:
      - ./backend:/app
      - ./oracle_client:/opt/oracle/instantclient
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - backend
    networks:
      - ckdo_net
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # ─────────────────────────────────────────
  # FRONTEND — React + Vite (dev server)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ckdo_frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # NGINX — Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ckdo_nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./e-magazine:/usr/share/nginx/html/e-magazine:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - keycloak
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # POSTGRESQL — Database
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ckdo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ckdo_dashboard,keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdo_net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # REDIS — Cache + Queue Broker
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ckdo_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdo_net
    restart: unless-stopped

# ─────────────────────────────────────────
networks:
  ckdo_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
